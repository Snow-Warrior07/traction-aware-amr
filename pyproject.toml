[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traction-aware-amr"
version = "0.1.0"
description = "Traction-aware warehouse rover digital twin"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.14", "matplotlib>=3.9", "PyYAML>=6"]

[project.scripts]
amr-test = "amr.experiments:main"

[tool.setuptools.packages.find]
include = ["amr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

