name: Phase verification
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q --junitxml=results/pytest.xml
      - run: python -m amr.experiments matrix --workers 4
      - run: python -m amr.experiments faults
      - run: python -m amr.experiments live --variant D --seconds 16 --fault overcurrent
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-results
          path: results/
  ros-gazebo:
    runs-on: ubuntu-24.04
    container: osrf/ros:jazzy-simulation-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare official ROS Jazzy and Gazebo image
        shell: bash
        run: |
          apt-get update -o Acquire::http::Timeout=30 -o Acquire::Retries=1
          apt-get install -y --no-install-recommends python3-venv
          python3 -m venv --system-site-packages .ci-venv
          .ci-venv/bin/pip install -r requirements.txt
          .ci-venv/bin/pip install -e .
      - name: Build and test real ROS graph, services, TF and bag replay
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source .ci-venv/bin/activate
          cd ros_ws
          colcon build --symlink-install
          source install/setup.bash
          cd ..
          export ROS_DOMAIN_ID=43
          python tools/ros_smoke.py
          python tools/generate_world.py
          python tools/gazebo_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ros-gazebo-results
          path: |
            results/
            models/
            ros_ws/log/
  pcb:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad 9 and ngspice
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad kicad-footprints ngspice python3-numpy
          kicad-cli version
      - run: python3 tools/check_spice.py
      - run: python3 tools/generate_pcb.py
      - name: Electrical and layout checks
        run: |
          kicad-cli sch erc --format json --output results/erc.json --exit-code-violations hardware/kicad/traction_carrier.kicad_sch
          kicad-cli pcb drc --format json --output results/drc.json --exit-code-violations --severity-error hardware/kicad/traction_carrier.kicad_pcb
      - name: Export virtual and fabrication artifacts
        run: |
          mkdir -p hardware/exports
          kicad-cli sch export svg --output hardware/exports/ hardware/kicad/traction_carrier.kicad_sch
          kicad-cli pcb export gerbers --output hardware/exports/gerbers/ hardware/kicad/traction_carrier.kicad_pcb
          kicad-cli pcb export drill --output hardware/exports/gerbers/ hardware/kicad/traction_carrier.kicad_pcb
          kicad-cli pcb export step --board-only --output hardware/exports/carrier.step hardware/kicad/traction_carrier.kicad_pcb
          kicad-cli pcb render --output hardware/exports/carrier.png --width 1600 --height 1000 hardware/kicad/traction_carrier.kicad_pcb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pcb-results
          path: |
            hardware/
            results/
